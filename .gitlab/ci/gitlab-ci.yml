image: gitlab.echothree.com:5050/containers/jdk-build-tools:latest

include:
  - template: Jobs/Dependency-Scanning.v2.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml

cache:
  - key: ivy2
    paths:
      - .ivy2/cache

variables:
  ANT_OPTS: "-Xmx6150m -Divy.default.ivy.user.dir=$CI_PROJECT_DIR/.ivy2"
  # Ant supplies the resolved Ivy report; other package managers need no resolution jobs.
  DS_DISABLED_RESOLUTION_JOBS: "maven,gradle,python"
  # Keep security scanners in the existing branch pipelines, including open MR branches.
  AST_ENABLE_MR_PIPELINES: "false"
  GITLAB_ADVANCED_SAST_ENABLED: "true"
  # Source analysis avoids a second Ant build in the SpotBugs analyzer.
  SAST_EXCLUDED_ANALYZERS: "spotbugs"
  # Semgrep's supplemental rules also inherit these exclusions through the template.
  DEFAULT_SAST_EXCLUDED_PATHS: "spec,test,tests,tmp,/generated/,**/build/,/lib/,/.ivy2/,**/*.min.js"

stages:
  - compile
  - test
  - javadoc

compile:
  stage: compile
  script:
    - ant setup-ivy
    - ant compile
    - ant deploy
    - ant dependency-report
  artifacts:
    paths:
      - generated/ivy/ivy-report.xml
      - build/ears/echothree.ear
      - build/jars/echothree-client.jar
      - build/ui/web/cms/war/cms.war
      - build/ui/web/letter/war/letter.war
      - build/ui/web/main/war/main.war
      - build/service/graphql/war/graphql.war
      - build/service/job/jar/echothree-job.jar
      - build/ui/cli/database/jar/database.jar
      - build/ui/cli/dataloader/jar/dataloader.jar
      - build/ui/cli/mailtransfer/jar/mailtransfer.jar
      - build/lib/jooq.jar
      - build/lib/jooq-codegen.jar
      - build/lib/jooq-meta.jar
      - build/lib/jakarta.xml.bind-api.jar
      - build/lib/r2dbc-spi.jar
      - build/lib/reactive-streams.jar
      - build/lib/mysql-connector-j.jar
      - build/lib/nekohtml.jar
      - build/lib/javax.mail.jar
      - build/lib/activation.jar
      - build/lib/javax.activation-api.jar
      - build/lib/xercesImpl.jar
      - build/lib/guava.jar
      - build/lib/icu4j.jar
      - build/lib/commons-cli.jar
      - build/lib/commons-lang.jar
      - build/lib/commons-configuration.jar
      - build/lib/commons-beanutils.jar
      - build/lib/jcl-over-slf4j.jar
      - build/lib/commons-collections.jar
      - build/lib/slf4j-api.jar
      - build/lib/logback-classic.jar
      - build/lib/logback-core.jar
      - build/lib/wildfly-client-all.jar
    expire_in: 1 week

dependency-scanning:
  stage: test
  variables:
    DS_MAX_DEPTH: "3"
  needs:
    - job: compile
      artifacts: true
  # Match the existing build's branch/tag pipelines, including branches with open MRs.
  # The report is a build artifact, so rules:exists cannot detect it before the build.
  rules:
    - if: '$DEPENDENCY_SCANNING_DISABLED == "true" || $DEPENDENCY_SCANNING_DISABLED == "1"'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

sast:
  # Source analyzers do not need build artifacts or the Ivy cache.
  needs: []
  cache: []

gitlab-advanced-sast:
  variables:
    # Leave capacity for the runner's second concurrent job.
    ADVANCED_SAST_AVAILABLE_CPUS: "4"
    ADVANCED_SAST_AVAILABLE_MEMORY: "16384"
    SAST_SCANNER_ALLOWED_CLI_OPTS: "--multi-core 4"
    GITLAB_ADV_SAST_INCR_SCAN: "true"
    ADVANCED_SAST_PARTIAL_SCAN: "differential"
    GITLAB_ADV_SAST_INCR_SCAN_SEARCH_PERIOD: "7 days"
  # The template retains ts-cache.sqlite.gz alongside the SAST report for reuse.
  artifacts:
    expire_in: 1 week

secret_detection:
  stage: test
  # Scan repository history without waiting for compilation or downloading build artifacts.
  needs: []
  cache: []
  rules:
    - if: '$SECRET_DETECTION_DISABLED == "true" || $SECRET_DETECTION_DISABLED == "1"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

javadoc:
  stage: javadoc
  needs:
    - job: compile
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_TAG =~ /^[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{2}$/'
  script:
    - ant setup-ivy
    - ant javadoc
  artifacts:
    paths:
      - build/jars/echothree-client-javadoc.jar
      - build/jars/echothree-client-sources.jar
    expire_in: 1 week
